[project]
name = "einfache-sprache-evals"
version = "0.1.0"
description = "Eval harness for the Einfache Sprache skill: does the text get easier without losing the facts?"
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai-slim[openai]>=1.0.0",
    "pydantic-evals>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
einfache_sprache_evals = "einfache_sprache_evals.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["einfache_sprache_evals"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["einfache-sprache-workspace"]

[tool.ruff.lint]
extend-select = [
    "C90",
    "D",
    "DJ",
    "E",
    "G",
    "I",
    "ISC",
    "N",
    "PERF",
    "PT",
    "PTH",
    "RET",
    "SIM",
    "SLOT",
    "T20",
    "TRY",
    "UP",
    "W",
]
ignore = ["D1", "D203", "D213", "E501", "TRY003", "T201"]

[tool.ruff.lint.per-file-ignores]
# Der Prüfer ist ein Kommandozeilenwerkzeug, Ausgabe ist sein Zweck.
"skills/einfache-sprache/scripts/*.py" = ["T20"]
"einfache_sprache_evals/*.py" = ["T20"]
