default_language_version:
  python: python3.14
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: pretty-format-json
        args: [--autofix, --indent, "2"]
      - id: check-toml
      - id: check-yaml
      - id: check-symlinks
      - id: debug-statements
      - id: destroyed-symlinks
      - id: check-executables-have-shebangs
      - id: end-of-file-fixer
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: detect-private-key
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-beautysh
          - mdformat-config
          - mdformat-footnote
          - mdformat-frontmatter
          - mdformat-gfm
          - mdformat-gfm-alerts
          - mdformat-ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: local
    hooks:
      - id: evals-selbsttest
        name: eval Selbsttest
        description: Das Eval-Gerüst und seine Regeln müssen arbeiten, bevor sie messen.
        entry: uv run --no-sync einfache_sprache_evals --selbsttest
        language: system
        pass_filenames: false
        files: ^(cases/.*\.yaml|einfache_sprache_evals/.*\.py|skills/einfache-sprache/.*)$
      - id: pruefen-selbsttest
        name: pruefen.py Selbsttest
        description: Der Prüfer muss seinen eigenen Test bestehen, bevor er Texte bewertet.
        entry: python3 skills/einfache-sprache/scripts/pruefen.py --selbsttest
        language: system
        pass_filenames: false
        files: ^skills/einfache-sprache/(scripts/pruefen\.py|SKILL\.md|references/.*)$
ci:
  skip:
    - no-commit-to-branch
    # Dem pre-commit.ci-Image fehlt uv; den Selbsttest fährt die evals-Action.
    - evals-selbsttest
